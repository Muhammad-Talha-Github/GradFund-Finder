name: Deploy public opportunity snapshot

on:
  push:
    branches: [main]
    paths:
      - "snapshot/**"
      - "scripts/build-public-snapshot.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build database-independent snapshot
        run: npm run snapshot:build
      - name: Upload snapshot site
        uses: actions/upload-pages-artifact@v3
        with:
          path: snapshot-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy snapshot only
        id: deployment
        uses: actions/deploy-pages@v4
